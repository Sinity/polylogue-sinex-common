schema = 1
[project]
id = "polylogue_sinex_common"
display_name = "Polylogue and Sinex shared tooling"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]

[environment]
kind = "nix-develop"
command = ["nix", "develop", "--command"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR", "CARGO_TARGET_DIR"]
unset = ["DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "SQLX_OFFLINE"]

[environment.values]
# Two builds run at once under the host cargo cap; -j8 each keeps them
# inside their memory ceilings instead of each spawning one rustc per thread.
CARGO_BUILD_JOBS = "8"

[operations.check]
description = "Formatting, clippy and every test, with build and test timings"
exec = ["cargo", "xtask", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"

[operations.exec]
description = "Run an explicit focused command in the shared development shell"
exec = ["env"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
cap = "cargo"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Selected shared-crate tests in the normal development queue"
exec = ["cargo", "xtask", "test", "--locked"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"

[operations.compile]
description = "Selected package or target compilation in the normal development queue"
exec = ["cargo", "check", "--locked"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 14400
cache = "none"
