schema = 1
[project]
id = "polylogue_sinex_common"
display_name = "Polylogue and Sinex shared tooling"
root_markers = ["Cargo.toml", "flake.nix", "xtask"]

[environment]
kind = "nix-develop"
command = ["env", "-u", "CARGO_TARGET_DIR", "nix", "develop", "--command"]
inherit = ["HOME", "USER", "PATH", "LANG", "XDG_RUNTIME_DIR"]
unset = ["CARGO_TARGET_DIR", "DATABASE_URL", "PGHOST", "PGPORT", "PGDATABASE", "PGUSER", "SQLX_OFFLINE"]

[environment.values]
# Builds run several at once; -j8 each keeps them
# inside their memory ceilings instead of each spawning one rustc per thread.
CARGO_BUILD_JOBS = "8"
# Incremental state is half of each target directory and the drive is write-bound;
# agent builds rarely reuse it across commits.
CARGO_INCREMENTAL = "0"

[operations.check]
description = "Formatting, clippy and every test, with build and test timings"
exec = ["cargo", "xtask", "check"]
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"

[operations.fmt]
description = "Format the workspace"
exec = ["cargo", "fmt", "--all"]
pool = "interactive"
result = "exit"
timeout_seconds = 300
scratch = "nvme"
cache = "none"

[operations.exec]
description = "Run an explicit focused command in the shared development shell"
exec = ["env"]
arguments = "required"
pool = "bulk"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
unit_properties = ["MemoryHigh=8G"]

[operations.focused]
description = "Selected shared-crate tests in the normal development queue"
exec = ["cargo", "xtask", "test", "--locked"]
arguments = "required"
pool = "normal"
result = "exit"
timeout_seconds = 1800
scratch = "tmpfs"
cache = "none"

[operations.compile]
description = "Selected package or target compilation"
exec = ["cargo", "check", "--locked"]
arguments = "required"
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"

[operations.codex]
description = "Run one Codex worker in this checkout: codex-worker <effort> <prompt-file> <output-schema> <output-dir> [model]"
exec = ["codex-worker"]
arguments = "required"
pool = "codex"
result = "exit"
timeout_seconds = 28800
cache = "none"

[operations.lint]
description = "Selected package Clippy checks"
exec = ["cargo", "clippy", "--locked"]
arguments = "required"
pool = "compile"
result = "exit"
timeout_seconds = 1800
scratch = "nvme"
cache = "none"
