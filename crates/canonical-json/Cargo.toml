[package]
name = "canonical-json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The one JSON encoding every identity hash in Polylogue and Sinex reads"
autotests = false

[dependencies]
blake3 = "1"
serde = "1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
# Both features change how serde_json holds maps and numbers; the encoding must
# give the same bytes with and without them.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

# One integration-test binary per crate: each test file is a module of
# tests/main.rs, so the crate and its dependencies link once.
[[test]]
name = "main"
path = "tests/main.rs"
