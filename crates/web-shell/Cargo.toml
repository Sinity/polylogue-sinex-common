[package]
name = "web-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Generate declarations from the runtime wire types; products serve committed assets.
typescript = ["dep:ts-rs", "command-surface/typescript"]

[[bin]]
name = "web-shell-types"
path = "src/bin/web-shell-types.rs"
required-features = ["typescript"]

[dependencies]
command-surface = { path = "../command-surface" }
http = "1"
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", optional = true, features = ["serde-compat", "no-serde-warnings"] }
