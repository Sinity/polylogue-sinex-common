[package]
name = "signals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
query-language = { path = "../query-language" }
jiff = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
maud = { version = "0.27", optional = true }

[features]
# The Inbox, Why and Signals views, rendered identically by both products.
web = ["dep:maud"]

[dev-dependencies]
tempfile = "3"
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }
