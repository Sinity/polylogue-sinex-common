[package]
name = "signals"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[dependencies]
query-language = { path = "../query-language" }
jiff = "0.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
query-language = { path = "../query-language", features = ["conformance"] }
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }

# One integration-test binary per crate: each test file is a module of
# tests/main.rs, so the crate and its dependencies link once.
[[test]]
name = "main"
path = "tests/main.rs"
