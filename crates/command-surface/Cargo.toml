[package]
name = "command-surface"
description = "Typed operation tables, transport adapters, the answer contract, failures, caller identity and event framing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["runtime"]
# The operation table, its transports, argument parsing and status
# measurement. Without it the crate is the wire vocabulary alone (envelopes,
# failures, values, seen marks), which a product's pure protocol crate can
# depend on without an async runtime.
runtime = ["dep:tokio", "dep:tokio-util"]
# TypeScript declarations of the wire types the web shell's script reads.
typescript = ["dep:ts-rs"]

[dependencies]
http = "1"
jiff = { version = "0.2", features = ["serde"] }

query-language = { path = "../query-language" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
ts-rs = { version = "11", optional = true, features = ["serde-compat", "no-serde-warnings"] }

[dev-dependencies]
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["test-util", "net"] }

# One integration-test binary per crate: each test file is a module of
# tests/main.rs, so the crate and its dependencies link once.
[[test]]
name = "main"
path = "tests/main.rs"
