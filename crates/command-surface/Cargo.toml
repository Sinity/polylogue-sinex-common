[package]
name = "command-surface"
description = "Typed operation tables, transport adapters, deadlines, failures and event framing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
http = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["test-util", "net"] }
