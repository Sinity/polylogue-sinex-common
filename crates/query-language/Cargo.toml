[package]
name = "query-language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Pure shared query grammar, time, continuation and compiler laws"

[features]
# Fixture rows, the reference evaluator and the reusable compiler law suite.
conformance = []

[dependencies]
blake3 = "1"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
historical-query-format-v1 = { path = "../historical-query-format-v1" }
serde_json = { version = "1", features = ["preserve_order"] }
proptest = "1"

[[test]]
name = "conditional"
required-features = ["conformance"]

[[test]]
name = "glob"
required-features = ["conformance"]

[[test]]
name = "ranking"
required-features = ["conformance"]

[[test]]
name = "semantics"
required-features = ["conformance"]

[[test]]
name = "text"
required-features = ["conformance"]

[[test]]
name = "witness"
required-features = ["conformance"]
