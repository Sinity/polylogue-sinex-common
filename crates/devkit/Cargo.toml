[package]
name = "devkit"
description = "Development commands shared by Polylogue and Sinex: test and check runs, their recorded history, changed-package selection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["cli"]
# The clap commands each project's xtask flattens into its own.
cli = ["dep:clap", "history"]
# PostgreSQL schema databases and per-test clones, through the PostgreSQL
# client tools; links no database library.
pg = []
# A throwaway nats-server with JetStream per run, and a subject prefix per
# test; links no NATS client.
nats = []
# The machine-wide SQLite history of runs, tests and diagnostics.
history = ["dep:rusqlite", "dep:zstd"]
# Representative benchmarks: a stratified sample of a corpus drawn once, runs
# recorded with the host's load, comparison and explicitly assumed linear estimates.
bench = ["history"]

[dependencies]
blake3 = "1"
libc = "0.2"
signal-hook = "0.3"
devkit-macros = { path = "../devkit-macros", version = "0.1.0" }
clap = { version = "4", features = ["derive"], optional = true }
quick-xml = "0.38"
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"], optional = true }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
