[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98.1"
repository = "https://github.com/Sinity/polylogue-sinex-common"
publish = false

# Tests spend most of their CPU in compression and the credential masker.
# Optimizing dependencies, and the workspace lightly, cuts that sharply while
# keeping incremental rebuilds cheap.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
