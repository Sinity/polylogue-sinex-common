# Builds each product's master against this pull request's head and runs that
# product's Clippy and tests, both products at once, so a pull request shows
# whether it breaks Polylogue or Sinex before it merges. The product is linked
# to the head the way `cargo xtask link-common <path>` links a local checkout.
# These jobs inform; `check` stays the one required status.
#
# A product's build cache belongs to its own repository, so every job compiles
# the product from nothing. A cold job measured about 3 minutes linking,
# 4 to 7 minutes building the tests and 10 minutes running them, so the tests
# run in three parts beside a lint job.
name: products

on:
  pull_request:

concurrency:
  group: products-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  product:
    name: ${{ matrix.product }} ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Polylogue's linked lint runs formatting and both Clippy configurations.
          # The pinned workspace-hack graph is checked in Polylogue's own CI.
          - { product: polylogue, part: lint, run: cargo xtask fast }
          - { product: polylogue, part: tests 1/3, run: cargo xtask test --partition hash:1/3 }
          - { product: polylogue, part: tests 2/3, run: cargo xtask test --partition hash:2/3 }
          - { product: polylogue, part: tests 3/3, run: cargo xtask test --partition hash:3/3 }
          # `check` is formatting, dependency boundaries and Clippy against
          # the schema database.
          - { product: sinex, part: lint, run: nix develop --command cargo xtask check }
          - { product: sinex, part: tests 1/3, run: nix develop --command cargo xtask test --partition hash:1/3 }
          - { product: sinex, part: tests 2/3, run: nix develop --command cargo xtask test --partition hash:2/3 }
          - { product: sinex, part: tests 3/3, run: nix develop --command cargo xtask test --partition hash:3/3 }
    env:
      COMMON_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sinity/${{ matrix.product }}
          ref: master
      # Outside the product's tree, so nothing in the product sees it as its own.
      - name: This pull request's head
        run: |
          COMMON="$RUNNER_TEMP/polylogue-sinex-common"
          echo "COMMON=$COMMON" >>"$GITHUB_ENV"
          git init -q "$COMMON"
          git -C "$COMMON" fetch -q --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY" "$COMMON_HEAD"
          git -C "$COMMON" checkout -q --detach FETCH_HEAD
      - name: Polylogue's job setup
        if: matrix.product == 'polylogue'
        uses: ./.github/actions/rust
      - name: Sinex's job setup
        if: matrix.product == 'sinex'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo nohup rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - if: matrix.product == 'sinex'
        uses: cachix/install-nix-action@v31
      - if: matrix.product == 'sinex'
        uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Link the product to this pull request's head
        run: ${{ matrix.product == 'sinex' && 'nix develop --command' || '' }} cargo xtask link-common "$COMMON"
      - name: ${{ matrix.run }}
        run: ${{ matrix.run }}
      - name: Report the product's own check of the same master commit
        if: ${{ !cancelled() && matrix.part == 'lint' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ matrix.product }}
        run: |
          commit=$(git rev-parse HEAD)
          own=$(gh run list -R "Sinity/$PRODUCT" --workflow check.yml --commit "$commit" --json status,conclusion,url \
            --jq '.[0] // empty | "\(if .conclusion == "" then .status else .conclusion end) \(.url)"')
          echo "Sinity/$PRODUCT master \`${commit:0:9}\` was checked against this pull request's head \`${COMMON_HEAD:0:9}\`. Its own check of that commit: ${own:-no run recorded}." >>"$GITHUB_STEP_SUMMARY"
          if [ "${own%% *}" = failure ]; then
            echo "::warning::Sinity/$PRODUCT master ${commit:0:9} already fails its own check (${own#* }); a failure in its jobs here need not come from this pull request."
          fi
