# Opens or updates a pull request in each product that moves its Cargo.lock to
# the newest commit of this repository's master branch.
#
# Needs the repository secret COMMON_BUMP_TOKEN: a fine-grained token for
# Sinity/polylogue and Sinity/sinex with Contents and Pull requests set to
# read and write.
name: Update product locks

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: update-product-locks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [polylogue, sinex]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sinity/${{ matrix.product }}
          token: ${{ secrets.COMMON_BUMP_TOKEN }}
      - name: Move shared crates in every workspace lock to this commit
        id: update
        env:
          GIT_TERMINAL_PROMPT: "0"
          COMMON_COMMIT: ${{ github.sha }}
        run: |
          updated=0
          while IFS= read -r -d '' lock; do
            manifest="${lock%Cargo.lock}Cargo.toml"
            [ -f "$manifest" ] || continue
            metadata=$(cargo metadata --manifest-path "$manifest" --format-version 1 --no-deps)
            mapfile -t crates < <(jq -r '[.packages[].dependencies[]
              | select(((.source // "") | split("#")[0]) == "git+https://github.com/Sinity/polylogue-sinex-common?branch=master")
              | .name] | unique | .[]' <<<"$metadata")
            [ "${#crates[@]}" -gt 0 ] || continue
            args=()
            for crate in "${crates[@]}"; do args+=(-p "$crate"); done
            cargo update --manifest-path "$manifest" "${args[@]}" --precise "$COMMON_COMMIT"
            updated=1
          done < <(git ls-files -z -- Cargo.lock '**/Cargo.lock')
          if [ "$updated" -eq 0 ]; then
            echo "no workspace follows polylogue-sinex-common's master branch" >&2
            exit 1
          fi
          echo "commit=$COMMON_COMMIT" >>"$GITHUB_OUTPUT"
          echo "short=${COMMON_COMMIT:0:9}" >>"$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.COMMON_BUMP_TOKEN }}
          branch: update-polylogue-sinex-common
          add-paths: |
            Cargo.lock
            **/Cargo.lock
          commit-message: Update polylogue-sinex-common to ${{ steps.update.outputs.short }}
          title: Update polylogue-sinex-common to ${{ steps.update.outputs.short }}
          body: |
            Moves workspace lock files to Sinity/polylogue-sinex-common@${{ steps.update.outputs.commit }}.

            Opened by the `Update product locks` workflow in polylogue-sinex-common. Convert any callers on this branch, then run the checks before merging.
          delete-branch: true
