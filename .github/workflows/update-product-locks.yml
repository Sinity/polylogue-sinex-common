# Opens or updates the pull request in each product that moves it to newer
# polylogue-sinex-common commits, on the product's `update-polylogue-sinex-common`
# branch.
#
# Sinex moves every workspace lock to this repository's newest master commit.
#
# Polylogue pins Sinex by revision, and one Cargo.lock resolves Sinex's common
# dependencies and Polylogue's own to the same common commit. So Polylogue
# moves only once Sinex's master has adopted a newer common commit: its Sinex
# revision moves to Sinex's master and its common lock to the commit that
# master pins, in one pull request. Sinex's `Update Polylogue` workflow starts
# this workflow when Sinex's master lock changes; a push here or a manual run
# also moves Polylogue when Sinex has adopted a commit it has not.
#
# Needs the repository secret COMMON_BUMP_TOKEN: a fine-grained token for
# Sinity/polylogue and Sinity/sinex with Contents and Pull requests set to
# read and write.
name: Update product locks

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: update-product-locks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      ADOPTION_BRANCH: update-polylogue-sinex-common
    strategy:
      fail-fast: false
      matrix:
        product: [sinex, polylogue]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sinity/${{ matrix.product }}
          token: ${{ secrets.COMMON_BUMP_TOKEN }}
      - name: Continue the existing adoption branch
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$ADOPTION_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "refs/heads/$ADOPTION_BRANCH"
            git checkout --detach FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Choose the commits to move to
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT: ${{ matrix.product }}
        run: |
          if [ "$PRODUCT" = sinex ]; then
            echo "common=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          pinned() {
            grep -oE 'git\+https://github.com/Sinity/polylogue-sinex-common\?branch=master#[0-9a-f]{40}' | cut -d'#' -f2 | sort -u
          }
          sinex=$(git ls-remote --exit-code https://github.com/Sinity/sinex refs/heads/master | cut -f1)
          common=$(curl -sSfL "https://raw.githubusercontent.com/Sinity/sinex/$sinex/Cargo.lock" | pinned)
          current=$(pinned <Cargo.lock)
          for commit in "$common" "$current"; do
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "a lock pins polylogue-sinex-common at more than one commit: $commit" >&2; exit 1; }
          done
          echo "Sinex master ${sinex:0:9} pins polylogue-sinex-common ${common:0:9}; Polylogue resolves ${current:0:9}"
          order=$(gh api "repos/Sinity/polylogue-sinex-common/compare/$current...$common" --jq .status)
          if [ "$order" = identical ]; then
            echo "Polylogue already resolves the commit Sinex master pins; nothing to move"
            echo "move=false" >>"$GITHUB_OUTPUT"
            exit 0
          elif [ "$order" != ahead ]; then
            echo "the commit Sinex master pins is not newer than Polylogue's (compare: $order); Polylogue stays where it is"
            echo "move=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git ls-files -z -- Cargo.toml '**/Cargo.toml' | xargs -0 sed -i -E \
            "s#(git = \"https://github.com/Sinity/sinex\", rev = \")[0-9a-f]{40}\"#\\1$sinex\"#"
          {
            echo "common=$common"
            echo "sinex=$sinex"
          } >>"$GITHUB_OUTPUT"
      - name: Move shared crates in every workspace lock to the chosen commit
        id: update
        if: steps.target.outputs.move != 'false'
        env:
          GIT_TERMINAL_PROMPT: "0"
          COMMON_COMMIT: ${{ steps.target.outputs.common }}
        run: |
          locks=()
          while IFS= read -r -d '' lock; do
            manifest="${lock%Cargo.lock}Cargo.toml"
            [ -f "$lock" ] && [ -f "$manifest" ] || continue
            metadata=$(cargo metadata --manifest-path "$manifest" --format-version 1 --no-deps)
            mapfile -t crates < <(jq -r '[.packages[].dependencies[]
              | select(((.source // "") | split("#")[0]) == "git+https://github.com/Sinity/polylogue-sinex-common?branch=master")
              | .name] | unique | .[]' <<<"$metadata")
            [ "${#crates[@]}" -gt 0 ] || continue
            locks+=("$lock")
            # `cargo update --precise` re-resolves the selected crates' registry
            # dependencies even at the commit already pinned, and can then pick
            # other versions of them; a lock already at the commit is left alone.
            pinned=$(grep -oE 'git\+https://github.com/Sinity/polylogue-sinex-common\?branch=master#[0-9a-f]{40}' "$lock" | cut -d'#' -f2 | sort -u)
            if [ "$pinned" = "$COMMON_COMMIT" ]; then
              echo "$lock already pins ${COMMON_COMMIT:0:9}"
              continue
            fi
            args=()
            for crate in "${crates[@]}"; do args+=(-p "$crate"); done
            cargo update --manifest-path "$manifest" "${args[@]}" --precise "$COMMON_COMMIT"
          done < <(git ls-files -z -- Cargo.lock '**/Cargo.lock')
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "no workspace follows polylogue-sinex-common's master branch" >&2
            exit 1
          fi
          {
            echo "commit=$COMMON_COMMIT"
            echo "short=${COMMON_COMMIT:0:9}"
          } >>"$GITHUB_OUTPUT"
      - name: Publish the update without replacing caller changes
        if: steps.target.outputs.move != 'false'
        env:
          GH_TOKEN: ${{ secrets.COMMON_BUMP_TOKEN }}
          COMMON_COMMIT: ${{ steps.update.outputs.commit }}
          COMMON_SHORT: ${{ steps.update.outputs.short }}
          SINEX_COMMIT: ${{ steps.target.outputs.sinex }}
          PRODUCT: ${{ matrix.product }}
        run: |
          # The checkout is fresh: its only changes are the moved revisions and locks.
          git add -u
          if git diff --cached --quiet; then
            echo "$PRODUCT already pins these commits; nothing to publish"
            exit 0
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
          fi
          title="Update polylogue-sinex-common to $COMMON_SHORT"
          moved="workspace lock files to Sinity/polylogue-sinex-common@$COMMON_COMMIT"
          if [ -n "$SINEX_COMMIT" ]; then
            title="Update Sinex to ${SINEX_COMMIT:0:9} and polylogue-sinex-common to $COMMON_SHORT"
            moved="the Sinex revision to Sinity/sinex@$SINEX_COMMIT and $moved, the commit that Sinex revision pins"
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "$title"
          # A concurrent caller commit rejects this push instead of being replaced.
          git push origin "HEAD:refs/heads/$ADOPTION_BRANCH"
          existing=$(gh pr list --state open --base master --head "$ADOPTION_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            body="$RUNNER_TEMP/common-lock-update.md"
            cat >"$body" <<EOF
          Moves $moved.

          Opened by the \`Update product locks\` workflow in polylogue-sinex-common. Convert any callers on this branch, then run the checks before merging. Later updates preserve those caller commits.
          EOF
            gh pr create --base master --head "$ADOPTION_BRANCH" \
              --title "$title" --body-file "$body"
          fi
