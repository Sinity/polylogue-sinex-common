name: fuzz

# Coverage-guided fuzzing of the query pipeline, long enough to explore deep
# and malformed queries. Every pull request already runs the token-sequence
# property in `query-language`'s tests; this run goes further on master.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain for libFuzzer's sanitizer flags
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and builds for its own
      # target unless told otherwise; AddressSanitizer needs the dynamically
      # linked gnu target, whose standard library the nightly toolchain has.
      - name: Fuzz for 45 minutes from the seeds
        working-directory: fuzz
        run: |
          mkdir -p corpus/query
          cp seeds/query/* corpus/query/
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu query corpus/query -- -max_total_time=2700 -timeout=30
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
